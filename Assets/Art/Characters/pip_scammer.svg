<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- The scammer: the same PIP shape in red, with a mask and a call-centre headset. -->
  <g stroke="#3A1414" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M78 58 L64 26" fill="none"/>
    <path d="M122 58 L136 26" fill="none"/>
    <circle cx="62" cy="22" r="12" fill="#FFC83D"/>
    <circle cx="138" cy="22" r="12" fill="#FFC83D"/>
    <ellipse cx="30" cy="132" rx="15" ry="22" fill="#FF6B57" transform="rotate(20 30 132)"/>
    <ellipse cx="170" cy="132" rx="15" ry="22" fill="#FF6B57" transform="rotate(-20 170 132)"/>
    <rect x="58" y="172" width="32" height="30" rx="13" fill="#FF6B57"/>
    <rect x="110" y="172" width="32" height="30" rx="13" fill="#FF6B57"/>
    <rect x="32" y="52" width="136" height="136" rx="50" fill="#FF6B57"/>
    <!-- headset band over the head and ear cups -->
    <path d="M40 104 C40 60 160 60 160 104" fill="none"/>
    <rect x="26" y="96" width="22" height="34" rx="9" fill="#2A2A33"/>
    <rect x="152" y="96" width="22" height="34" rx="9" fill="#2A2A33"/>
    <!-- microphone arm -->
    <path d="M160 128 C160 150 140 156 122 152" fill="none"/>
    <circle cx="118" cy="152" r="7" fill="#2A2A33"/>
    <!-- mask band across the eyes -->
    <rect x="44" y="90" width="112" height="34" rx="16" fill="#1A1A22"/>
  </g>
  <ellipse cx="66" cy="76" rx="14" ry="8" fill="#FFFFFF" opacity="0.4" transform="rotate(-25 66 76)"/>
  <!-- angry slanted eyes through the mask -->
  <path d="M68 104 L90 110 L86 116 L68 112 Z" fill="#FFFFFF"/>
  <path d="M132 104 L110 110 L114 116 L132 112 Z" fill="#FFFFFF"/>
  <!-- frown -->
  <path d="M86 148 C94 140 106 140 114 148" fill="none" stroke="#3A1414" stroke-width="5" stroke-linecap="round"/>
</svg>
